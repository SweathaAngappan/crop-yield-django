{% extends 'predictor/base.html' %}
{% block content %}
<div class="card">
  <form method="POST">
    {% csrf_token %}
    <label>State</label>
    <select name="state" required>
      {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>

    <label>Crop</label>
    <select name="crop" required>
      {% for c in crops %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>

    <label>Season</label>
    <select name="season" required>
      {% for se in seasons %}<option value="{{ se }}">{{ se }}</option>{% endfor %}
    </select>

    <label>Crop year</label>
    <input type="number" name="year" value="2010" min="1997" max="2030" required>

    <label>Cultivated area (hectares)</label>
    <input type="number" name="area" value="1000" step="0.1" required>

    <button type="submit">Predict production</button>
  </form>

  {% if prediction is not None %}
  <div class="result">Predicted production: {{ prediction }}</div>
  {% endif %}
</div>
{% endblock %}
